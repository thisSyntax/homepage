---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/
#
# Groups can nest (a list item that is itself a list becomes a sub-group/
# column) - see settings.yaml's `layout` for the row/column styling that
# pairs with the group names used here.
#
# KNOWN ISSUE: Arr Stack is nested here (Media > Arr Stack) for the desired
# visual layout, but per Homepage's own docs
# (gethomepage.dev/widgets/services/calendar/) the Calendar widget's
# radarr/sonarr service_group/service_name lookup only works against
# TOP-LEVEL groups. This exact nesting was confirmed live to break that
# lookup (calendar showed only the current day, no events). Layout was
# prioritized over the integration on request - if new-release events
# aren't appearing on the Calendar card, this is why.
- Infrastructure:
    - Proxmox:
        icon: proxmox.png
        href: {{HOMEPAGE_VAR_PROXMOX_IP_URL}}
        widget:
          type: proxmox
          url: {{HOMEPAGE_VAR_PROXMOX_IP_URL}}
          username: {{HOMEPAGE_VAR_PROXMOX_API_ID}}
          password: {{HOMEPAGE_VAR_PROXMOX_API_KEY}}
    - Synology:
        icon: synology
        href: {{HOMEPAGE_VAR_SYNOLOGY_IP_URL}}
        widget:
          type: diskstation
          url: {{HOMEPAGE_VAR_SYNOLOGY_IP_URL}}
          username: {{HOMEPAGE_VAR_SYNOLOGY_USERNAME}}
          password: {{HOMEPAGE_VAR_SYNOLOGY_PASSWORD}}

- Services:
    - Apps:
        - Plex:
            icon: plex
            href: https://plex.{{HOMEPAGE_VAR_WEB_DOMAIN}}
            widget:
              type: plex
              url: https://plex.{{HOMEPAGE_VAR_WEB_DOMAIN}}
              key: {{HOMEPAGE_VAR_PLEX_API_KEY}} # see https://www.plexopedia.com/plex-media-server/general/plex-token/
        - Tautulli:
            icon: tautulli
            href: https://tautulli.{{HOMEPAGE_VAR_WEB_DOMAIN}}
            server: docker-media
            container: tautulli
            widget:
              type: tautulli
              url: https://tautulli.{{HOMEPAGE_VAR_WEB_DOMAIN}}
              key: {{HOMEPAGE_VAR_TAUTULLI_API_KEY}} # see https://tautulli.com/api/v2
        - Immich:
            icon: immich
            href: https://immich.{{HOMEPAGE_VAR_WEB_DOMAIN}}
            server: docker-media
            container: immich_server
            widget:
              type: immich
              url: https://immich.{{HOMEPAGE_VAR_WEB_DOMAIN}}
              key: {{HOMEPAGE_VAR_IMMICH_TOKEN}}
              version: 2
        - Home Assistant:
            icon: home-assistant
            href: {{HOMEPAGE_VAR_HOMEASSISTANT_URL}}
            server: docker-essentials
            container: homeassistant
            widget:
              type: homeassistant
              url: {{HOMEPAGE_VAR_HOMEASSISTANT_URL}}
              key: {{HOMEPAGE_VAR_HOMEASSISTANT_TOKEN}}

    - Admin:
        - Komodo:
            icon: komodo
            server: komodo
            container: komodo-core-1
            href: {{HOMEPAGE_VAR_KOMODO_IP_URL}}
            showStats: false
            widget:
              type: komodo
              url: {{HOMEPAGE_VAR_KOMODO_IP_URL}}
              key: {{HOMEPAGE_VAR_KOMODO_API_KEY}}
              secret: {{HOMEPAGE_VAR_KOMODO_SECRET}}
              showSummary: false # optional, default: false. Takes precedence over showStacks
              showStacks: true # optional, default: false
              fields: ["running", "down", "total"] # Allowed fields (max 4): ["total", "running", "stopped", "unhealthy", "unknown"]

    - Network:
        - Speedtest-Tracker:
            icon: speedtest-tracker
            href: http://{{HOMEPAGE_VAR_DOCKER-OTHERS_IP}}
            server: docker-others
            container: speedtest-tracker
            widget:
              type: speedtest
              url: http://{{HOMEPAGE_VAR_DOCKER-OTHERS_IP}}

    - DNS:
        - Pi-hole 1:
            icon: pihole
            href: http://{{HOMEPAGE_VAR_PIHOLE1_IP}}
            widget:
              type: pihole
              url: http://{{HOMEPAGE_VAR_PIHOLE1_IP}}
              version: 6 # required if running v6 or higher, defaults to 5
              key: {{HOMEPAGE_VAR_PIHOLE1_API_KEY}} # optional, in v6 can be your password or app password
        - Pi-hole 2:
            icon: pihole
            href: http://{{HOMEPAGE_VAR_PIHOLE2_IP}}
            widget:
              type: pihole
              url: http://{{HOMEPAGE_VAR_PIHOLE2_IP}}
              version: 6 # required if running v6 or higher, defaults to 5
              key: {{HOMEPAGE_VAR_PIHOLE2_API_KEY}} # optional, in v6 can be your password or app password
        

- Media:
    - Arr Stack:
        - Radarr:
            icon: radarr
            href: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:7878
            server: docker-media
            container: radarr
            widget:
              type: radarr
              url: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:7878
              key: {{HOMEPAGE_VAR_RADARR_API_KEY}}
              fields: ["wanted", "missing", "movies"] # allowed: wanted, missing, queued, movies (queued needs enableQueue: true, omitted here)
        - Sonarr:
            icon: sonarr
            href: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:8989
            server: docker-media
            container: sonarr
            widget:
              type: sonarr
              url: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:8989
              key: {{HOMEPAGE_VAR_SONARR_API_KEY}}
              fields: ["wanted", "series"] # allowed: wanted, queued, series (queued needs enableQueue: true, omitted here)
        - Lidarr:
            icon: lidarr
            href: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:8686
            server: docker-media
            container: lidarr
            widget:
              type: lidarr
              url: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:8686
              key: {{HOMEPAGE_VAR_LIDARR_API_KEY}}
              fields: ["wanted", "artists"] # allowed: wanted, queued, artists (queued needs enableQueue: true, omitted here)
        - Bazarr:
            icon: bazarr
            href: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:6767
            server: docker-media
            container: bazarr
            widget:
              type: bazarr
              url: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:6767
              key: {{HOMEPAGE_VAR_BAZARR_API_KEY}}
              fields: ["missingEpisodes", "missingMovies"] # only 2 fields exist for this widget
        - Prowlarr:
            icon: prowlarr
            href: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:9696
            server: docker-media
            container: prowlarr
            widget:
              type: prowlarr
              url: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:9696
              key: {{HOMEPAGE_VAR_PROWLARR_API_KEY}}
              fields: ["numberOfGrabs", "numberOfQueries", "numberOfFailGrabs"] # allowed: numberOfGrabs, numberOfQueries, numberOfFailGrabs, numberOfFailQueries

    - Calendar:
        - Calendar:
            icon: mdi-calendar-month-outline-#ffffff
            widget:
              type: calendar
              firstDayInWeek: sunday # optional - defaults to monday
              view: agenda # optional - possible values monthly, agenda - agenda is required for previousDays to have any effect
              maxEvents: 15 # optional - defaults to 10
              showTime: true # optional - show time for event happening today - defaults to false
              previousDays: 7 # optional - shows events since seven days ago - defaults to 0 - only applies in agenda view
              timezone: America/New_York # optional and only when timezone is not detected properly (slightly slower performance) - force timezone for ical events (if it's the same - no change, if missing or different in ical - will be converted to this timezone)
              integrations: # optional
                - type: radarr # active widget type that is currently enabled on homepage - possible values: radarr, sonarr, lidarr, readarr, ical
                  service_group: Arr Stack # group name where widget exists - nested under Media, which is confirmed NOT to resolve (see comment at top of file); kept for when this is revisited
                  service_name: Radarr # service name for that widget
                  baseUrl: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}} # optional - adds links to sonarr/radarr pages (field is camelCase - `baseurl` is silently ignored)
                  params: # optional - additional params for the service
                    unmonitored: true # optional - defaults to false, used with *arr stack
                - type: sonarr # active widget type that is currently enabled on homepage - possible values: radarr, sonarr, lidarr, readarr, ical
                  service_group: Arr Stack # group name where widget exists - nested under Media, which is confirmed NOT to resolve (see comment at top of file); kept for when this is revisited
                  service_name: Sonarr # service name for that widget
                  baseUrl: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}} # optional - adds links to sonarr/radarr pages (field is camelCase - `baseurl` is silently ignored)
                  params: # optional - additional params for the service
                    unmonitored: true # optional - defaults to false, used with *arr stack

    - Management:
        - Seerr:
            icon: seerr
            href: https://overseerr.{{HOMEPAGE_VAR_WEB_DOMAIN}}
            server: docker-media
            container: seerr # renamed from `jellyseerr` when migrated to Seerr
            widget:
              type: seerr # Jellyseerr/Overseerr merged into Seerr (Feb 2026); `jellyseerr` still works as a legacy alias but `seerr` is the maintained type
              url: https://overseerr.{{HOMEPAGE_VAR_WEB_DOMAIN}}
              key: {{HOMEPAGE_VAR_JELLYSEERR_API_KEY}} # see https://jellyseerr.com/docs/api/getting-started/authentication
        - Syncthing:
            icon: syncthing
            href: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:8384
            server: docker-media
            container: syncthing
        - Notifiarr:
            icon: notifiarr
            href: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:5454
            server: docker-media
            container: notifiarr