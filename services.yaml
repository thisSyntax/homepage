---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/
#
# Groups can nest (a list item that is itself a list becomes a sub-group/
# column) - see settings.yaml's `layout` for the row/column styling that
# pairs with the group names used here.
- Infrastructure:
    - Proxmox:
        icon: proxmox.png
        href: {{HOMEPAGE_VAR_PROXMOX_IP_URL}}
        widget:
          type: proxmox
          url: {{HOMEPAGE_VAR_PROXMOX_IP_URL}}
          username: {{HOMEPAGE_VAR_PROXMOX_API_ID}}
          password: {{HOMEPAGE_VAR_PROXMOX_API_KEY}}
    - Synology:
        icon: synology
        href: {{HOMEPAGE_VAR_SYNOLOGY_IP_URL}}
        widget:
          type: diskstation
          url: {{HOMEPAGE_VAR_SYNOLOGY_IP_URL}}
          username: {{HOMEPAGE_VAR_SYNOLOGY_USERNAME}}
          password: {{HOMEPAGE_VAR_SYNOLOGY_PASSWORD}}

- Services:
    - Apps:
        - Plex:
            icon: plex
            href: https://plex.{{HOMEPAGE_VAR_WEB_DOMAIN}}
            widget:
              type: plex
              url: https://plex.{{HOMEPAGE_VAR_WEB_DOMAIN}}
              key: {{HOMEPAGE_VAR_PLEX_API_KEY}} # see https://www.plexopedia.com/plex-media-server/general/plex-token/
        - Tautulli:
            icon: tautulli
            href: https://tautulli.{{HOMEPAGE_VAR_WEB_DOMAIN}}
            server: docker-media
            container: tautulli
            widget:
              type: tautulli
              url: https://tautulli.{{HOMEPAGE_VAR_WEB_DOMAIN}}
              key: {{HOMEPAGE_VAR_TAUTULLI_API_KEY}} # see https://tautulli.com/api/v2
        - Immich:
            icon: immich
            href: https://immich.{{HOMEPAGE_VAR_WEB_DOMAIN}}
            server: docker-media
            container: immich_server
            widget:
              type: immich
              url: https://immich.{{HOMEPAGE_VAR_WEB_DOMAIN}}
              key: {{HOMEPAGE_VAR_IMMICH_TOKEN}}
              version: 2
        - Home Assistant:
            icon: home-assistant
            href: {{HOMEPAGE_VAR_HOMEASSISTANT_URL}}
            server: docker-essentials
            container: homeassistant
            widget:
              type: homeassistant
              url: {{HOMEPAGE_VAR_HOMEASSISTANT_URL}}
              key: {{HOMEPAGE_VAR_HOMEASSISTANT_TOKEN}}

    - Admin:
        - Komodo:
            icon: komodo
            server: komodo
            container: komodo-core-1
            href: {{HOMEPAGE_VAR_KOMODO_IP_URL}}
            showStats: false
            widget:
              type: komodo
              url: {{HOMEPAGE_VAR_KOMODO_IP_URL}}
              key: {{HOMEPAGE_VAR_KOMODO_API_KEY}}
              secret: {{HOMEPAGE_VAR_KOMODO_SECRET}}
              showSummary: false # optional, default: false. Takes precedence over showStacks
              showStacks: true # optional, default: false
              fields: ["running", "down", "total"] # allowed fields (max 4): total, running, stopped, unhealthy, unknown

    - Network:
        - Unifi Controller:
            icon: unifi
            href: https://{{HOMEPAGE_VAR_UNIFI_IP}}
            widget:
              type: unifi
              url: https://{{HOMEPAGE_VAR_UNIFI_IP}}
              username: {{HOMEPAGE_VAR_UNIFI_USERNAME}}
              password: {{HOMEPAGE_VAR_UNIFI_PASSWORD}}
        - Speedtest-Tracker:
            icon: speedtest-tracker
            href: http://{{HOMEPAGE_VAR_DOCKER-OTHERS_IP}}
            server: docker-others
            container: speedtest-tracker
            widget:
              type: speedtest
              url: http://{{HOMEPAGE_VAR_DOCKER-OTHERS_IP}}
              version: 2 # required if running v2 or higher, defaults to 1
              key: {{HOMEPAGE_VAR_SPEEDTEST_TRACKER_API_KEY}} # in v2 this is your password or an app password

    - DNS:
        - Pi-hole 1:
            icon: pi-hole
            href: https://{{HOMEPAGE_VAR_PIHOLE1_IP}}/admin
            widget:
              type: pihole
              url: https://{{HOMEPAGE_VAR_PIHOLE1_IP}}
              version: 6 # required if running v6 or higher, defaults to 5
              key: {{HOMEPAGE_VAR_PIHOLE1_API_KEY}} # in v6 this is your password or an app password
        - Pi-hole 2:
            icon: pi-hole
            href: https://{{HOMEPAGE_VAR_PIHOLE2_IP}}/admin
            widget:
              type: pihole
              url: https://{{HOMEPAGE_VAR_PIHOLE2_IP}}
              version: 6 # required if running v6 or higher, defaults to 5
              key: {{HOMEPAGE_VAR_PIHOLE2_API_KEY}} # in v6 this is your password or an app password
        - Traefik Internal:
            icon: traefik
            href: https://internal-traefik.{{HOMEPAGE_VAR_WEB_DOMAIN}}/dashboard/
            widget:
              type: traefik
              url: https://internal-traefik.{{HOMEPAGE_VAR_WEB_DOMAIN}}
              username: {{HOMEPAGE_VAR_ITRAEFIK_USER}}
              password: {{HOMEPAGE_VAR_ITRAEFIK_PASSWD}}
        - Traefik External:
            icon: traefik

- Media:
    - Arr Stack:
        - Radarr:
            icon: radarr
            href: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:7878
            server: docker-media
            container: radarr
            widget:
              type: radarr
              url: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:7878
              key: {{HOMEPAGE_VAR_RADARR_API_KEY}}
              fields: ["wanted", "missing", "movies"] # allowed fields: wanted, missing, queued, movies
        - Sonarr:
            icon: sonarr
            href: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:8989
            server: docker-media
            container: sonarr
            widget:
              type: sonarr
              url: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:8989
              key: {{HOMEPAGE_VAR_SONARR_API_KEY}}
              fields: ["wanted", "series"] # allowed fields: wanted, queued, series
        - Lidarr:
            icon: lidarr
            href: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:8686
            server: docker-media
            container: lidarr
            widget:
              type: lidarr
              url: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:8686
              key: {{HOMEPAGE_VAR_LIDARR_API_KEY}}
              fields: ["wanted", "artists"] # allowed fields: wanted, queued, artists
        - Bazarr:
            icon: bazarr
            href: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:6767
            server: docker-media
            container: bazarr
            widget:
              type: bazarr
              url: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:6767
              key: {{HOMEPAGE_VAR_BAZARR_API_KEY}}
              fields: ["missingEpisodes", "missingMovies"]
        - Prowlarr:
            icon: prowlarr
            href: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:9696
            server: docker-media
            container: prowlarr
            widget:
              type: prowlarr
              url: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:9696
              key: {{HOMEPAGE_VAR_PROWLARR_API_KEY}}
              fields: ["numberOfGrabs", "numberOfQueries", "numberOfFailGrabs"] # allowed fields: numberOfGrabs, numberOfQueries, numberOfFailGrabs, numberOfFailQueries

    - Calendar:
        - Calendar:
            icon: mdi-calendar-month-outline-#ffffff
            widget:
              type: calendar
              firstDayInWeek: sunday
              view: monthly
              maxEvents: 10
              showTime: true
              timezone: America/New_York
              integrations:
                - type: radarr
                  service_group: Arr Stack
                  service_name: Radarr
                  params:
                    unmonitored: true
                - type: sonarr
                  service_group: Arr Stack
                  service_name: Sonarr
                  params:
                    unmonitored: true
        - Agenda:
            icon: mdi-calendar-month-outline-#ffffff
            widget:
              type: calendar
              firstDayInWeek: sunday
              view: agenda
              maxEvents: 10
              showTime: true
              previousDays: 0
              timezone: America/New_York
              integrations:
                - type: radarr
                  service_group: Arr Stack
                  service_name: Radarr
                  baseUrl: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}
                  params:
                    unmonitored: true
                - type: sonarr
                  service_group: Arr Stack
                  service_name: Sonarr
                  baseUrl: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}
                  params:
                    unmonitored: true

    - Management:
        - Seerr:
            icon: seerr
            href: https://overseerr.{{HOMEPAGE_VAR_WEB_DOMAIN}}
            server: docker-media
            container: seerr
            widget:
              type: seerr
              url: https://overseerr.{{HOMEPAGE_VAR_WEB_DOMAIN}}
              key: {{HOMEPAGE_VAR_JELLYSEERR_API_KEY}} # see https://jellyseerr.com/docs/api/getting-started/authentication
        - Syncthing:
            icon: syncthing
            href: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:8384
            server: docker-media
            container: syncthing
            widget:
              type: syncthing
              url: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:8384
              key: {{HOMEPAGE_VAR_SYNCTHING_API_KEY}} # see https://docs.syncthing.net/users/api.html
        - Notifiarr:
            icon: notifiarr
            href: http://{{HOMEPAGE_VAR_DOCKER-MEDIA_IP}}:5454
            server: docker-media
            container: notifiarr
