---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

title: Fey Server Infrastructure

background:
  image: /images/cyberpunk.jpg
  opacity: 70 # 0-100

cardBlur: md # xs, md, etc... see https://tailwindcss.com/docs/backdrop-blur

theme: dark # or light

color: teal

blockHighlights:
  levels:
    good: "bg-emerald-500/40 text-emerald-950 dark:bg-emerald-900/60 dark:text-emerald-400"
    warn: "bg-amber-300/30 text-amber-900 dark:bg-amber-900/30 dark:text-amber-200"
    danger: "bg-rose-700/45 text-rose-200 dark:bg-rose-950/70 dark:text-rose-400"

iconStyle: theme # optional, defaults to gradient
useEqualHeights: true
layout:
  # Rendering order follows this block's key order, not services.yaml's.
  # Key names below must match the actual group name in services.yaml/
  # bookmarks.yaml exactly - an unmatched key (e.g. "Bookmarks" when
  # bookmarks.yaml's category is named "Quick Links") is silently ignored,
  # and bookmarks then fall back to their default bottom-of-page placement.
  Quick Links:
    header: false
    style: row
    columns: 4

  Infrastructure:
    icon: mdi-desktop-classic-#ffffff
    style: row
    columns: 2

  Services:
    icon: mdi-shield-crown-outline-#ffffff
    style: row
    columns: 4
    Apps:
      style: column
    Admin:
      style: column
    Network:
      style: column
    DNS:
      style: column

  Media:
    icon: si-vlcmediaplayer-#ffffff
    style: row
    columns: 3
    Arr Stack:
      # Nested per request, despite this being confirmed to break the
      # Calendar widget's radarr/sonarr service_group lookup - see the
      # comment at the top of services.yaml.
      style: row
      columns: 2
    Calendar:
      style: column
    Management:
      style: column


headerStyle: boxedWidgets #underlined # or boxed, boxedWidgets, clean

quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
  showSearchSuggestions: true
  hideVisitURL: true
  provider: bing # google, duckduckgo, bing, baidu, brave or custom

hideVersion: true

showStats: false

statusStyle: 'basic'

hideErrors: false